{% extends "base.html" %}

{% block title %}Clients — {{ dashboard_title }}{% endblock %}

{% block content %}
<div x-data="FDO.listComponent({{ clients | tojson }}, 'status')">

  <!-- Page Header -->
  <div class="page-header" style="display:flex;align-items:center;justify-content:space-between">
    <div>
      <h1>Clients</h1>
      <p>Relationship health and account status</p>
    </div>
    <span class="badge badge-info" x-text="filtered.length + ' client' + (filtered.length !== 1 ? 's' : '')"></span>
  </div>

  <!-- Filter + Search -->
  <div class="filter-bar">
    <div class="search-box" style="width:280px">
      <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color:var(--text-muted);flex-shrink:0">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <input type="text" placeholder="Search clients..." x-model="searchQuery" aria-label="Search clients">
    </div>
    <button class="filter-pill" :class="{ 'active': activeFilter === '' }"      @click="setFilter('')">All</button>
    <button class="filter-pill" :class="{ 'active': activeFilter === 'active' }" @click="setFilter('active')">Active</button>
    <button class="filter-pill" :class="{ 'active': activeFilter === 'inactive' }" @click="setFilter('inactive')">Inactive</button>
  </div>

  <!-- Client Cards Grid -->
  <div class="clients-grid">

    <!-- Empty state -->
    <template x-if="filtered.length === 0">
      <div class="card" style="grid-column:1/-1">
        <div class="empty-state">
          <div class="empty-state-icon">👥</div>
          <div class="empty-state-title" x-text="searchQuery ? 'No results for \'' + searchQuery + '\'' : 'No clients yet'"></div>
          <div class="empty-state-desc">Clients created via the Client MCP server will appear here.</div>
        </div>
      </div>
    </template>

    <!-- Client Cards -->
    <template x-for="client in filtered" :key="client.id">
      <div class="client-card">
        <div class="client-header">
          <div>
            <div class="client-name" x-text="client.name"></div>
            <div class="client-company" x-text="client.company || 'No company'"></div>
          </div>
          <!-- Status badge (conditional rendering) -->
          <span
            class="badge"
            :class="{
              'badge-success': client.status === 'active',
              'badge-neutral': client.status !== 'active'
            }"
            x-text="client.status"
          ></span>
        </div>

        <!-- Client details -->
        <div style="margin:0.75rem 0;display:flex;flex-direction:column;gap:0.35rem">
          <div style="font-size:0.82rem;color:var(--text-secondary)">
            <span style="color:var(--text-muted)">Email:</span>
            <span x-text="client.email || '—'"></span>
          </div>
          <div style="font-size:0.82rem;color:var(--text-secondary)">
            <span style="color:var(--text-muted)">Since:</span>
            <span x-text="client.created_at ? client.created_at.slice(0,10) : '—'"></span>
          </div>
        </div>

        <!-- Health bar (conditionally styled) -->
        <div class="health-bar-wrap">
          <div class="health-bar-label">
            <span>Health Score</span>
            <span x-text="client.health_score + '/100'"></span>
          </div>
          <div class="health-bar">
            <div
              class="health-fill"
              :class="{
                'good':    client.health_status === 'good',
                'average': client.health_status === 'average',
                'poor':    client.health_status === 'poor'
              }"
              :style="'width:' + client.health_score + '%'"
            ></div>
          </div>

          <!-- Health status label (conditional) -->
          <div style="margin-top:0.3rem;font-size:0.75rem" :style="{
            color: client.health_status === 'good' ? '#34d399' :
                   client.health_status === 'poor' ? '#f87171' : '#fbbf24'
          }" x-text="client.health_status ? client.health_status.toUpperCase() : 'UNKNOWN'">
          </div>
        </div>

        <!-- At-risk warning (conditionally shown) -->
        <template x-if="client.health_status === 'poor'">
          <div style="margin-top:0.75rem;font-size:0.78rem;padding:0.5rem 0.75rem;background:rgba(239,68,68,0.1);border-radius:6px;color:#f87171">
            ⚠️ Client health is poor — follow up recommended
          </div>
        </template>
      </div>
    </template>

  </div>{# /.clients-grid #}

  <!-- Summary -->
  <div class="stat-grid" style="margin-top:0.5rem">
    <div class="stat-item">
      <span class="stat-label">Total</span>
      <span class="stat-value" x-text="items.length"></span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Active</span>
      <span class="stat-value success" x-text="items.filter(c => c.status === 'active').length"></span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Healthy</span>
      <span class="stat-value success" x-text="items.filter(c => c.health_status === 'good').length"></span>
    </div>
    <div class="stat-item">
      <span class="stat-label">At Risk</span>
      <span class="stat-value danger" x-text="items.filter(c => c.health_status === 'poor').length"></span>
    </div>
  </div>

</div>{# /x-data #}
{% endblock %}
